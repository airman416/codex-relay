<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-label="Claude hands a computer-use task to a Codex app chat; you press Enter; Codex works in its in-app browser; the report and files go back to Claude">
  <style>
    .t { fill: #1f2328; font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .s { fill: #59636e; font: 400 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .l { fill: #59636e; font: 500 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.5; }
    .you { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.5; }
    .ln { stroke: #818b98; stroke-width: 1.8; fill: none; }
    .ah { fill: #818b98; }
    .claude { fill: #d97757; }
    .codex { fill: #10a37f; }
    .kbd { fill: #ffffff; stroke: #d4a72c; stroke-width: 1.2; }
    .kt { fill: #7d4e00; font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #f0f6fc; }
      .s, .l { fill: #9198a1; }
      .box { fill: #151b23; stroke: #3d444d; }
      .you { fill: #272115; stroke: #9e6a03; }
      .ln { stroke: #656c76; }
      .ah { fill: #656c76; }
      .kbd { fill: #0d1117; stroke: #9e6a03; }
      .kt { fill: #e3b341; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="ah" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>

  <!-- Claude -->
  <rect class="box" x="10" y="40" width="250" height="110" rx="12"/>
  <circle class="claude" cx="38" cy="70" r="7"/>
  <text class="t" x="54" y="76">Claude</text>
  <text class="s" x="30" y="104">Writes and fixes the code.</text>
  <text class="s" x="30" y="124">Hands off computer use.</text>

  <!-- You -->
  <rect class="you" x="315" y="56" width="250" height="78" rx="12"/>
  <text class="t" x="335" y="88">You</text>
  <rect class="kbd" x="378" y="70" width="58" height="24" rx="5"/>
  <text class="kt" x="390" y="87">Enter</text>
  <text class="s" x="335" y="117">Start the new Codex chat.</text>

  <!-- Codex -->
  <rect class="box" x="620" y="40" width="250" height="110" rx="12"/>
  <circle class="codex" cx="648" cy="70" r="7"/>
  <text class="t" x="664" y="76">Codex app chat</text>
  <text class="s" x="640" y="104">Tests the app, screenshots,</text>
  <text class="s" x="640" y="124">page DOM, in-app browser.</text>

  <!-- arrows -->
  <path class="ln" d="M262 95 H312" marker-end="url(#a)"/>
  <path class="ln" d="M567 95 H617" marker-end="url(#a)"/>
  <path class="ln" d="M745 152 V205 H135 V152" marker-end="url(#a)"/>
  <text class="l" x="440" y="226" text-anchor="middle">Report and saved files go back to Claude automatically</text>
  <text class="l" x="287" y="86" text-anchor="middle">task</text>
  <text class="l" x="592" y="86" text-anchor="middle">starts</text>
</svg>
